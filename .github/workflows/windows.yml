name: Windows checks and build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:launcher
      - run: npm audit --omit=dev
        # Build tooling (the electron-builder tree) is dev-only and never shipped. picomatch <= 4.0.7
        # (GHSA-fc5q-39xc-vjpf) has no patched release yet; restore the full audit or add an override
        # once a fixed version is published.
      - name: Download isolated test core
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/v1.19.33
          $asset = $release.assets | Where-Object name -eq 'mihomo-windows-amd64-v1-v1.19.33.zip'
          if (!$asset) { throw 'Pinned Mihomo asset not found; review release asset names.' }
          New-Item -ItemType Directory -Force .local/ci-core | Out-Null
          Invoke-WebRequest $asset.browser_download_url -OutFile .local/ci-core/core.zip
          Expand-Archive .local/ci-core/core.zip .local/ci-core/bin
          $binary = Get-ChildItem .local/ci-core/bin -Filter '*.exe' | Select-Object -First 1
          if (!$binary) { throw 'Core executable missing.' }
          "MIHOMO_BINARY=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run test:core
      - run: npm run build
      - run: npm run test:package
      - run: npm run source
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-x64
          path: |
            release/*setup.exe
            release/*.blockmap
            release/*source.zip
            release/*.sha256
            .local/ui-*/report.json
            .local/core-*/report.json
            .local/启动器*/report.json
          if-no-files-found: error
